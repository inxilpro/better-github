<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Better GitHub</title>
	<link href="options.css" rel="stylesheet" />
</head>
<body>
<main>
	<h1>Better GitHub</h1>
	
	<form id="settings">
		<label class="field">
			<span class="label">Your GitHub username</span>
			<input
				autocomplete="off"
				id="username"
				placeholder="octocat"
				spellcheck="false"
				type="text"
			/>
			<span class="hint">
              Draft pull requests you opened stay readable; everyone else's fade out. Draft dimming is off until you fill this in.
            </span>
		</label>
		
		<label class="checkbox">
			<input id="dimDrafts" type="checkbox" />
			<span>Dim draft pull requests in lists</span>
		</label>
		
		<label class="checkbox">
			<input id="rewritePullsLinks" type="checkbox" />
			<span>Add a default filter to bare pull request links</span>
		</label>
		
		<label class="field">
			<span class="label">Default pull request filter</span>
			<input
				autocomplete="off"
				id="defaultPullsFilter"
				spellcheck="false"
				type="text"
			/>
			<span class="hint">
              Appended to links like <code>github.com/&lt;owner&gt;/&lt;repo&gt;/pulls</code>.
            </span>
		</label>
		
		<div class="actions">
			<button class="primary" type="submit">Save</button>
			<button id="reset" type="button">Reset defaults</button>
			<span id="status" role="status"></span>
		</div>
	</form>
</main>

<script src="options.js" type="module"></script>
</body>
</html>
